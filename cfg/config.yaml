defaults:
  - _self_
  - learning: arnold
  - run: train

# ==================== Experiment ====================
project: arnold
exp_name: arnold_obc
notes: "Arnold Training"

# ==================== Hardware ====================
device: cuda
device_ids: null # null | [0, 1]
seed: 42

# ==================== Logging ====================
use_wandb: true
wandb_project: arnold
no_log: false

# ==================== Resume ====================
epoch: 0  # 0 = start from scratch, >0 = resume, -1 = latest
resume_checkpoint: null  # Путь к .pth для resume из произвольного чекпоинта (перекрывает epoch)

# ==================== Hydra ====================
hydra:
  job:
    name: ${exp_name}
    env_set:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
  run:
    dir: data/trained_models/${exp_name}
