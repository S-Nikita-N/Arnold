type: myohuman
config_path: null
checkpoint_epoch: 0
simple: false
overrides: []       # Hydra overrides for both train and valid envs
train_overrides: [] # Hydra overrides for train env only, e.g. ["run.motion_ids_file=/path/to/negatives.txt"]
valid_overrides: [] # Hydra overrides for valid env only

# Per-expert parallelism (null = use global run.num_threads / learning.min_batch_size)
num_threads: null
# vec_batch_size: number of parallel envs for vectorized GPU sampling (null = num_threads)
vec_batch_size: null

# Per-expert loss weights (null = use global cfg.learning.*)
learning:
  loss_scale: 1.0
  min_batch_size: null
  ppo_weight: null
  obc_imitation_weight: null
  bc_imitation_weight: null
  entropy_weight: null
  load_balance_weight: null

# Offline BC from pre-collected teacher demonstrations.
# Generated by: arnold.experts.scripts.evaluate_kinesis_teacher --split {train,test}
# Files expected in dataset_dir: train.json, train.npz, test.json, test.npz
bc:
  dataset_dir: null                # directory with {train,test}.{json,npz}
  batch_size: 256                  # BC sampling batch size
  success_only: false              # use only trajectories with success=true
  max_mpjpe_threshold: null        # max allowed per-frame max_mpjpe (meters), null = no filter
  mean_mpjpe_threshold: null       # max allowed per-frame mean_mpjpe (meters), null = no filter
