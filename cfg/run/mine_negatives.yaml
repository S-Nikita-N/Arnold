# Hard Negative Mining Config

# ==================== Splits ====================
mine_train: true     # mine on training set
mine_test: true      # mine on test/validation set

# ==================== Criteria (OR — any triggers negative) ====================
# Per-split thresholds. Train is stricter (model already saw these motions).
train:
  mean_mpjpe: 0.08    # meters, null = disabled
  max_mpjpe: 0.15
  not_success: true

test:
  mean_mpjpe: 0.08
  max_mpjpe: 0.15
  not_success: true

# ==================== Output ====================
output_name: negatives  # base name: {output_dir}/{output_name}_{split}.txt + .json meta

# ==================== Parallelism ====================
num_threads: null     # null = use expert's num_threads
vectorized_eval: true

# ==================== Checkpointing ====================
save_frequency: 1000
save_curr_frequency: 50
resampling_interval: 100
log_frequency: 1

# ==================== Paths ====================
output_dir: data/trained_models/${exp_name}

# ==================== Experts ====================
experts: {}

# ==================== Evaluation ====================
eval_frequency: 1
train_eval_frequency: 1
finish_episodes: false
headless: true
