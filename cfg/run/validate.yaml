# Validation Run Config

# ==================== Checkpoint ====================
checkpoint: ""  # путь к .pth (обязателен для validate_policy)

# ==================== Visualization ====================
headless: false
num_motions: -1  # -1 = все движения
sleep_per_step: 0.0  # задержка между шагами (сек)

# ==================== Parallelism ====================
num_threads: 1

# ==================== Experts ====================
# mode: "valid" = eval config (no random_start, no heading randomization)
#       "train" = train config (random_start, heading randomization)
mode: valid
experts: {}
# ==================== Performance ====================
# При true: не считать std head и value decoder в get_action (быстрее при eval)
fast_eval: true
