# Validation Run Config

# ==================== Checkpoint ====================
checkpoint: ""  # путь к .pth (обязателен для validate_policy)

# ==================== Visualization ====================
headless: false
num_motions: -1  # -1 = все движения
sleep_per_step: 0.0  # задержка между шагами (сек)

# ==================== Parallelism ====================
num_threads: 1

# ==================== Experts ====================
# Аналогично train.yaml, но для валидации используется mode="valid"
experts:
  - type: kinesis
    config_path: null
    checkpoint_epoch: -1
    # Hydra overrides, которые пробрасываются напрямую в конфиг эксперта.
    # Пример:
    #   overrides:
    #     - "run.xml_path=/path/to/myohuman_simpletorso.xml"
    overrides: []

# ==================== Performance ====================
# При true: не считать std head и value decoder в get_action (быстрее при eval)
fast_eval: true
