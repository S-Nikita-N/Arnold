# Training Run Config

# ==================== Checkpointing ====================
save_frequency: 1000
save_curr_frequency: 50
resampling_interval: 100
log_frequency: 1

# ==================== Parallelism ====================
num_threads: 1
headless: true

# ==================== Vectorized Sampling ====================
# finish_episodes: true  = after reaching min_batch_size, keep stepping active workers
#                          until all current episodes end (done/truncated)
# finish_episodes: false = stop sampling immediately when min_batch_size is reached
finish_episodes: false

# ==================== Paths ====================
output_dir: data/trained_models/${exp_name}

# ==================== Experts ====================
# Список сред/экспертов для обучения.
# type: kinesis | myohuman
#   kinesis   — MyoLegs эксперт (Kinesis submodule)
#   myohuman  — Полнотелый эксперт (MyoHuman submodule)
# checkpoint_epoch: -1 = latest, 0 = без экспертной policy, >0 = конкретная эпоха
#
# Если len(experts) > 1 — требуется кросс-задачная нормализация (не реализована).
# PPO-only: установить checkpoint_epoch=0 и learning.obc_imitation_weight=0.
experts: {}

# ==================== Evaluation ====================
eval_frequency: 100  # Частота валидации (каждые N эпох), 0 = отключить
train_eval_frequency: 500  # Eval на train выборке (каждые N эпох), 0 = отключить
vectorized_eval: true  # true = параллельная валидация (GPU inference + CPU env workers)
                       # автоматически false при headless=false (нужен рендер)
