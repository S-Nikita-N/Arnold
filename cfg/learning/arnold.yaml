# Arnold Architecture & Learning Config

# ==================== Policy Type ====================
policy: transformer  # transformer | lattice

# ==================== Global (parser, sampling) ====================
history_len: 5
tokenizer_granularity: scalar  # scalar | per_spec | per_body

# ==================== Transformer (только при policy: transformer) ====================
transformer:
  embed_dim: 128
  ff_dim: 512
  num_heads: 4
  num_enc_layers: 6
  num_act_dec_layers: 6
  num_val_dec_layers: 1
  dropout: 0.0
  detached_value_encoder: false
  action_cov_rank: 16  # 0 = independent (diagonal), >0 = low-rank (Lattice-like)
  cov_mode: head  # action_out | head
  min_diag_std: 0.0001
  log_std_init: 0
  action_granulation: none  # none | anatomical | functional | hybrid
  # Hierarchical decoder (optional, overrides num_act_dec_layers):
  # Types: g2g (group_to_group) | wg (within_group). cross_attn defaults: g2g=true, wg=false.
  # Example:
  #   [{type: g2g, cross_attn: true}, {type: g2g, cross_attn: true}, {type: wg, cross_attn: false}]
  action_decoder_layers: null

# ==================== PPO ====================
batch_size: 128
learning_rate: 1.e-4
weight_decay: 0.0
gamma: 0.99
tau: 0.95  # GAE lambda
clip_epsilon: 0.2
opt_num_epochs: 10
grad_clip: 0.5

# ==================== OBC Loss Weights ====================
ppo_weight: 0
imitation_weight: 1.0
value_weight: 0.5
entropy_weight: 0

# ==================== Training ====================
min_batch_size: 51200
max_epochs: 100000
use_scheduler: false
transfer_mode: true
use_compile: false
use_bfloat16: false

# ==================== Lattice (только при policy_type: lattice) ====================
lattice:
  mlp_units: [2048, 1536, 1024, 1024, 512, 512]
  mlp_activation: silu
  fix_std: false
  log_std_init: 0
  min_diag_std: 0.0001
