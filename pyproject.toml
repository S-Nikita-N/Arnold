[project]
name = "arnold"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "wandb>=0.28.0,<0.29",
    "sk-video==1.1.10",
    "gymnasium==1.3.0",
    "gym==0.26.2",
    "gym-notices==0.1.0",
    "hydra-core>=1.3.4,<2.0",
    "mujoco==3.10.0",
    "easydict==1.13",
    "h5py>=3.16.0,<4",
    "importlib-resources==7.1.0",
    "ipdb==0.13.13",
    "joblib>=1.5.3,<2.0",
    "matplotlib>=3.11.0,<4.0",
    "numpy>=2.5.1,<3.0",
    "numpy-stl>=4.0.0,<5.0",
    "omegaconf==2.3.1",
    "pandas>=3.0.3,<4.0",
    "pyopengl==3.1.10",
    "pytest>=9.1.1,<10.0",
    "scikit-learn>=1.9.0,<2.0",
    "scipy>=1.18.0,<2.0",
    "termcolor>=3.3.0,<4.0",
    "torch>=2.13.0,<3.0",
    "tqdm>=4.68.4,<5.0",
    "ipykernel>=7.3.0,<8.0",
    "smplx @ git+https://github.com/ZhengyiLuo/smplx.git@a5b8e4ac14f79f3f33fd2cf2a16e6f507146b813",
    "lxml>=6.1.1,<7.0",
    "httpx>=0.28.1,<0.29",
    "openai>=2.45.0,<3.0",
    "huggingface-hub>=1.23.0,<2.0",
    "python-dotenv>=1.2.2,<2.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.156.6",
    "pre-commit>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arnold"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tools/pre_commit"]
markers = [
    "stage2: heavy/accelerator test; runs only when a GPU/MPS device is present or RUN_STAGE2=1",
]

# Expert submodules are third-party (git submodules) — excluded everywhere.
[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["src/arnold/experts/Kinesis", "src/arnold/experts/myochallenge-lattice", "src/arnold/experts/Myohuman"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "C4", "PT"]

[tool.typos.files]
extend-exclude = ["src/arnold/experts/Kinesis", "src/arnold/experts/myochallenge-lattice", "src/arnold/experts/Myohuman", "downloads", "docs"]

# Domain terms / muscle abbreviations that are not typos: DELT (deltoid),
# abd (abduction), sart (sartorius), GAE (advantage estimation), ANC, strat, thr.
[tool.typos.default.extend-words]
DELT = "DELT"
abd = "abd"
sart = "sart"
strat = "strat"
gae = "gae"
anc = "anc"
thr = "thr"

# Scoped to the typed tooling for now; annotating the legacy src/ is a
# separate follow-up (hundreds of implicit-Optional / attr-defined findings).
[tool.mypy]
python_version = "3.12"
files = ["tools"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["arnold", "tools"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
